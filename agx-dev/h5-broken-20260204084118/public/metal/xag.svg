  <circle cx="32" cy="32" r="30" fill="url(#silver)" stroke="#666666" stroke-width="2"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <text x="32" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">XAG</text>
  <text x="32" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555555">SILVER</text>
