  <circle cx="450" cy="715" r="25" fill="none" stroke="#c41e3a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="450" y="712" text-anchor="middle" fill="#c41e3a" font-family="Arial, sans-serif" font-size="8" font-weight="600">MAS</text>
  <text x="450" y="724" text-anchor="middle" fill="#c41e3a" font-family="Arial, sans-serif" font-size="7">OFFICIAL</text>
