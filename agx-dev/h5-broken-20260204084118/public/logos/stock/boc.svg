<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 中国银行真实logo：红底+古钱币造型 -->
  <circle cx="50" cy="50" r="48" fill="#C41230"/>
  <!-- 古钱币外圆 -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#fff" stroke-width="6"/>
  <!-- 中间方孔 -->
  <rect x="40" y="40" width="20" height="20" fill="#C41230" stroke="#fff" stroke-width="5"/>
  <!-- 上下连接 -->
  <rect x="47" y="18" width="6" height="22" fill="#fff"/>
  <rect x="47" y="60" width="6" height="22" fill="#fff"/>
  <!-- 左右连接 -->
  <rect x="18" y="47" width="22" height="6" fill="#fff"/>
  <rect x="60" y="47" width="22" height="6" fill="#fff"/>
</svg>
