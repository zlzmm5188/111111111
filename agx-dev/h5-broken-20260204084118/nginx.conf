# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name agx.bi www.agx.bi;
    return 301 https://$server_name$request_uri;
}

# HTTP 重定向到 HTTPS（二级域名邀请链接）
server {
    listen 80;
    server_name *.agx.bi;
    return 301 https://$host$request_uri;
}

# HTTPS 二级域名邀请链接处理
server {
    listen 443 ssl http2;
    server_name *.agx.bi;

    # SSL 证书配置（需要泛域名证书）
    ssl_certificate /etc/nginx/ssl/agx.bi.pem;
    ssl_certificate_key /etc/nginx/ssl/agx.bi.key;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 从二级域名提取邀请码，重定向到主站邀请落地页
    # 例如: abc123.agx.bi -> agx.bi/i/abc123
    set $invite_code "";
    if ($host ~* ^([^.]+)\.agx\.bi$) {
        set $invite_code $1;
    }

    # 排除 www 和 api 等保留子域名
    if ($invite_code = "www") {
        return 301 https://agx.bi$request_uri;
    }
    if ($invite_code = "api") {
        return 301 https://agx.bi$request_uri;
    }
    if ($invite_code = "admin") {
        return 301 https://agx.bi$request_uri;
    }

    # 重定向到邀请落地页（带邀请码参数）
    location = / {
        return 302 https://agx.bi/i/$invite_code;
    }

    # 其他路径也重定向到主站
    location / {
        return 302 https://agx.bi$request_uri?ref=$invite_code;
    }
}

# HTTPS 主服务器
server {
    listen 443 ssl http2;
    server_name agx.bi www.agx.bi;

    # SSL 证书配置（Cloudflare 证书）
    ssl_certificate /etc/nginx/ssl/agx.bi.pem;
    ssl_certificate_key /etc/nginx/ssl/agx.bi.key;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API 代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://127.0.0.1:3001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 超时配置
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
