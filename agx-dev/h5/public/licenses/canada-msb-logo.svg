<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
  </defs>
  
  <!-- 外圈银色边框 -->
  <circle cx="60" cy="60" r="58" fill="url(#silver-grad)" stroke="#888" stroke-width="1"/>
  
  <!-- 红色外环 -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#red-grad)" stroke-width="8"/>
  
  <!-- 白色内圈 -->
  <circle cx="60" cy="60" r="44" fill="#ffffff"/>
  
  <!-- 上方文字弧形 - CANADIAN REGISTERED -->
  <path id="topArc" d="M 20 60 A 40 40 0 0 1 100 60" fill="none"/>
  <text fill="#cc0000" font-family="Arial, sans-serif" font-size="7" font-weight="bold">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">CANADIAN REGISTERED</textPath>
  </text>
  
  <!-- 下方文字弧形 - MONEY SERVICES BUSINESS -->
  <path id="bottomArc" d="M 20 60 A 40 40 0 0 0 100 60" fill="none"/>
  <text fill="#cc0000" font-family="Arial, sans-serif" font-size="6" font-weight="bold">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">MONEY SERVICES BUSINESS</textPath>
  </text>
  
  <!-- 枫叶 -->
  <g transform="translate(60, 38) scale(0.5)">
    <path d="M0,-30 L4,-20 L16,-24 L12,-14 L24,-10 L14,-4 L18,10 L8,6 L0,24 L-8,6 L-18,10 L-14,-4 L-24,-10 L-12,-14 L-16,-24 L-4,-20 Z" fill="#ff0000"/>
    <rect x="-3" y="20" width="6" height="12" fill="#ff0000"/>
  </g>
  
  <!-- MSB 文字 -->
  <text x="60" y="85" text-anchor="middle" fill="#333333" font-family="Arial Black, sans-serif" font-size="22" font-weight="900">MSB</text>
</svg>