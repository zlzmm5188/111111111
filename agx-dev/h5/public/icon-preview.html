<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>邀请好友图标预览</title>
  <style>
    body { background: #0D1117; padding: 40px; font-family: sans-serif; }
    .container { display: flex; gap: 60px; justify-content: center; flex-wrap: wrap; }
    .icon-box { text-align: center; }
    .icon-box svg { width: 64px; height: 64px; color: #C8AA6E; }
    .icon-box p { color: #fff; margin-top: 12px; font-size: 14px; }
    h1 { color: #fff; text-align: center; margin-bottom: 40px; }
  </style>
</head>
<body>
  <h1>邀请好友图标方案</h1>
  <div class="container">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="9" cy="7" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 19v-1a4 4 0 014-4h4a4 4 0 014 4v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M18 8v4m-2-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <p>当前图标<br>(一人+加号)</p>
    </div>
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M2 19v-1a4 4 0 014-4h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="17" cy="7" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M22 19v-1a4 4 0 00-4-4h-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M10 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 2"/>
      </svg>
      <p>方案A<br>(双人连接)</p>
    </div>
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 20v-1a4 4 0 014-4h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M15 5l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 9h-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <p>方案B<br>(分享箭头)</p>
    </div>
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="8" cy="7" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 19v-1a4 4 0 014-4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="14" y="10" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.8"/>
        <path d="M18 10v8M14 14h8" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <p>方案C<br>(礼物邀请)</p>
    </div>
  </div>
</body>
</html>
